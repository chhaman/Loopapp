name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Miniapp bundles and headers are up to date
        run: npm run miniapps:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Cloudflare build (OpenNext)
        run: npx opennextjs-cloudflare build

  database:
    name: Database (migrations + RLS tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-db.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ENABLE_TEST_HARNESS: "1"
      E2E_PROD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
