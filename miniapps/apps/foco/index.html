<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foco</title>
<style>
/*LOOP_BASE_CSS*/
.ring { position: relative; width: 240px; height: 240px; margin: 0 auto; }
.ring svg { transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 14; }
.ring .track { stroke: var(--surface-2); }
.ring .bar { stroke: var(--phase, var(--accent)); stroke-linecap: round; transition: stroke-dashoffset .4s linear, stroke .3s; }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.time { font-size: 52px; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.phase { font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--phase, var(--accent)); }
.row { display: flex; gap: 10px; justify-content: center; }
.dots { display: flex; gap: 6px; justify-content: center; min-height: 10px; }
.dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--phase-focus); }
body { --phase-focus: var(--accent); --phase-break: #22c59a; }
</style>
</head>
<body>
<main class="app" aria-live="polite">
  <div class="ring">
    <svg width="240" height="240" viewBox="0 0 240 240" aria-hidden="true">
      <circle class="track" cx="120" cy="120" r="100"></circle>
      <circle class="bar" id="bar" cx="120" cy="120" r="100"></circle>
    </svg>
    <div class="center">
      <div class="phase" id="phase"></div>
      <div class="time" id="time" role="timer">25:00</div>
      <div class="muted" id="cycles"></div>
    </div>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="row">
    <button class="primary" id="toggle"></button>
    <button id="skip"></button>
    <button id="reset"></button>
  </div>
</main>
<script>/*LOOP_SDK*/</script>
<script>
(function () {
  var t = Loop.t;
  var PHASES = {
    focus: { seconds: 25 * 60, label: { es: "Foco", en: "Focus" }, color: "var(--phase-focus)" },
    rest: { seconds: 5 * 60, label: { es: "Pausa", en: "Break" }, color: "var(--phase-break)" }
  };
  var C = 2 * Math.PI * 100;
  var el = function (id) { return document.getElementById(id); };
  var state = { phase: "focus", remaining: PHASES.focus.seconds, running: false, cycles: 0, endsAt: 0, timer: null };

  el("bar").style.strokeDasharray = C;
  el("skip").textContent = t({ es: "Saltar", en: "Skip" });
  el("reset").textContent = t({ es: "Reiniciar", en: "Reset" });

  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }

  function render() {
    var p = PHASES[state.phase];
    document.body.style.setProperty("--phase", p.color);
    el("phase").textContent = t(p.label);
    el("time").textContent = fmt(state.remaining);
    el("bar").style.strokeDashoffset = C * (1 - state.remaining / p.seconds);
    el("toggle").textContent = state.running ? t({ es: "Pausar", en: "Pause" }) : t({ es: "Empezar", en: "Start" });
    el("cycles").textContent = state.cycles + " " + t(state.cycles === 1 ? { es: "ciclo", en: "cycle" } : { es: "ciclos", en: "cycles" });
    var dots = el("dots"); dots.innerHTML = "";
    for (var i = 0; i < Math.min(state.cycles, 8); i++) dots.appendChild(document.createElement("span"));
  }

  function tick() {
    state.remaining = Math.max(0, Math.round((state.endsAt - Date.now()) / 1000));
    if (state.remaining === 0) advance();
    render();
  }

  function advance() {
    if (state.phase === "focus") state.cycles++;
    state.phase = state.phase === "focus" ? "rest" : "focus";
    state.remaining = PHASES[state.phase].seconds;
    state.endsAt = Date.now() + state.remaining * 1000;
  }

  function stop() { state.running = false; clearInterval(state.timer); }

  el("toggle").addEventListener("click", function () {
    if (state.running) { stop(); }
    else {
      state.running = true;
      state.endsAt = Date.now() + state.remaining * 1000;
      state.timer = setInterval(tick, 250);
      Loop.interaction("start");
    }
    render();
  });
  el("skip").addEventListener("click", function () {
    advance(); if (!state.running) state.endsAt = 0;
    Loop.interaction("skip"); render();
  });
  el("reset").addEventListener("click", function () {
    stop(); state.phase = "focus"; state.remaining = PHASES.focus.seconds; state.cycles = 0; render();
  });

  render();
  Loop.ready();
})();
</script>
</body>
</html>
