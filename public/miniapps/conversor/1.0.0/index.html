<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor</title>
<style>
:root {
  --bg: #fbf8f3; --surface: #ffffff; --surface-2: #f3eee6; --line: #e6dfd4;
  --text: #16131f; --muted: #615b6e; --accent: #ff5a47; --on-accent: #16131f;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f0d16; --surface: #1a1724; --surface-2: #242031; --line: #322d42;
  --text: #f4f1ec; --muted: #aaa4b8; --accent: #ff6b59; --on-accent: #16131f;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  overflow: hidden; user-select: none;
}
button, input, select { font: inherit; color: inherit; }
button {
  border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; font-weight: 700;
  background: var(--surface-2); transition: transform .12s ease, background .2s ease;
}
button:active { transform: scale(.96); }
button.primary { background: var(--accent); color: var(--on-accent); }
:focus-visible { outline: 3px solid #7b6cf6; outline-offset: 2px; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 20px; }
.app { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
body { --accent: #22c59a; }
.tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.tabs button { flex: 1; padding: 10px 0; background: transparent; font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.box { background: var(--surface-2); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.box input, .box output { font-size: 34px; font-weight: 800; border: 0; background: transparent; width: 100%; outline: none; letter-spacing: -.02em; font-variant-numeric: tabular-nums; min-height: 44px; }
.box select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 8px; align-self: flex-start; }
.swap { align-self: center; width: 48px; height: 48px; padding: 0; font-size: 20px; margin: -8px 0; position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--line); }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
</style>
</head>
<body>
<main class="app">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="box">
    <span class="label" id="lblFrom"></span>
    <input id="value" inputmode="decimal" value="1" autocomplete="off">
    <select id="from"></select>
  </div>
  <button class="swap" id="swap">⇅</button>
  <div class="box">
    <span class="label" id="lblTo"></span>
    <output id="result" aria-live="polite"></output>
    <select id="to"></select>
  </div>
</main>
<script>/* Loopapp miniapp SDK v1 — inlined into every miniapp at build time.
 * The miniapp runs in a sandboxed iframe with an opaque origin: no cookies,
 * no storage, no network. It can only talk to the host through postMessage. */
(function () {
  var params = new URLSearchParams(location.search);
  var lang = params.get("lang") === "en" ? "en" : "es";
  var theme = params.get("theme") === "light" ? "light" : "dark";
  document.documentElement.lang = lang;
  document.documentElement.setAttribute("data-theme", theme);

  function send(type, extra) {
    var msg = { source: "loop-miniapp", v: 1, type: type };
    if (extra) for (var k in extra) msg[k] = extra[k];
    try { window.parent.postMessage(msg, "*"); } catch { /* host unavailable */ }
  }

  window.addEventListener("error", function (e) {
    send("error", { message: String((e && e.message) || "error").slice(0, 200) });
  });
  window.addEventListener("unhandledrejection", function () {
    send("error", { message: "unhandled rejection" });
  });

  window.Loop = {
    lang: lang,
    theme: theme,
    /** Pick the string for the current language: Loop.t({ es: "Hola", en: "Hi" }) */
    t: function (pair) { return pair[lang] || pair.es; },
    /** Report a meaningful interaction (used for anonymous analytics only). */
    interaction: function (name) { send("interaction", { name: String(name).slice(0, 40) }); },
    ready: function () { send("ready"); },
  };
})();</script>
<script>
(function () {
  var t = Loop.t, el = function (id) { return document.getElementById(id); };
  var KINDS = {
    length: { label: { es: "Longitud", en: "Length" }, units: {
      m: { label: { es: "Metros", en: "Meters" }, f: 1 }, km: { label: { es: "Kilómetros", en: "Kilometers" }, f: 1000 },
      cm: { label: { es: "Centímetros", en: "Centimeters" }, f: .01 }, mi: { label: { es: "Millas", en: "Miles" }, f: 1609.344 },
      ft: { label: { es: "Pies", en: "Feet" }, f: .3048 }, in: { label: { es: "Pulgadas", en: "Inches" }, f: .0254 } }, def: ["km", "mi"] },
    weight: { label: { es: "Peso", en: "Weight" }, units: {
      kg: { label: { es: "Kilogramos", en: "Kilograms" }, f: 1 }, g: { label: { es: "Gramos", en: "Grams" }, f: .001 },
      lb: { label: { es: "Libras", en: "Pounds" }, f: .45359237 }, oz: { label: { es: "Onzas", en: "Ounces" }, f: .028349523125 } }, def: ["kg", "lb"] },
    temp: { label: { es: "Temperatura", en: "Temperature" }, units: {
      c: { label: { es: "Celsius", en: "Celsius" } }, f: { label: { es: "Fahrenheit", en: "Fahrenheit" } }, k: { label: { es: "Kelvin", en: "Kelvin" } } }, def: ["c", "f"] }
  };
  var kind = "length";
  var nf = new Intl.NumberFormat(Loop.lang === "en" ? "en-US" : "es-AR", { maximumFractionDigits: 4 });

  function toC(v, u) { return u === "c" ? v : u === "f" ? (v - 32) * 5 / 9 : v - 273.15; }
  function fromC(v, u) { return u === "c" ? v : u === "f" ? v * 9 / 5 + 32 : v + 273.15; }

  function convert(v, from, to) {
    if (kind === "temp") return fromC(toC(v, from), to);
    var u = KINDS[kind].units; return v * u[from].f / u[to].f;
  }

  function fill(select, selected) {
    select.innerHTML = "";
    Object.keys(KINDS[kind].units).forEach(function (key) {
      var o = document.createElement("option"); o.value = key; o.textContent = t(KINDS[kind].units[key].label);
      if (key === selected) o.selected = true; select.appendChild(o);
    });
  }

  function setKind(k) {
    kind = k; fill(el("from"), KINDS[k].def[0]); fill(el("to"), KINDS[k].def[1]);
    Array.prototype.forEach.call(el("tabs").children, function (b) { b.setAttribute("aria-selected", String(b.dataset.kind === k)); });
    render();
  }

  function render() {
    var v = parseFloat(el("value").value.replace(",", "."));
    el("result").textContent = isFinite(v) ? nf.format(convert(v, el("from").value, el("to").value)) : "—";
  }

  Object.keys(KINDS).forEach(function (k) {
    var b = document.createElement("button"); b.setAttribute("role", "tab"); b.dataset.kind = k; b.textContent = t(KINDS[k].label);
    b.addEventListener("click", function () { setKind(k); Loop.interaction("kind"); });
    el("tabs").appendChild(b);
  });
  el("lblFrom").textContent = t({ es: "De", en: "From" });
  el("lblTo").textContent = t({ es: "A", en: "To" });
  el("swap").setAttribute("aria-label", t({ es: "Intercambiar unidades", en: "Swap units" }));
  el("value").setAttribute("aria-label", t({ es: "Valor a convertir", en: "Value to convert" }));
  el("value").addEventListener("input", render);
  el("value").addEventListener("change", function () { Loop.interaction("convert"); });
  el("from").addEventListener("change", render);
  el("to").addEventListener("change", render);
  el("swap").addEventListener("click", function () {
    var a = el("from").value; el("from").value = el("to").value; el("to").value = a; Loop.interaction("swap"); render();
  });

  setKind("length");
  Loop.ready();
})();
</script>
</body>
</html>
